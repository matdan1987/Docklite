name: postgres-db
description: PostgreSQL Datenbank
image: postgres:15
detached: true
restart: unless-stopped

ports:
  - "${port}:5432"

volumes:
  - "${data_dir}:/var/lib/postgresql/data"

environment:
  POSTGRES_PASSWORD: "${password}"
  POSTGRES_USER: "${user}"
  POSTGRES_DB: "${database}"

variables:
  port:
    description: "Port auf dem Host"
    default: "5432"
  password:
    description: "Datenbank Passwort"
    default: "postgres"
  user:
    description: "Datenbank Benutzer"
    default: "postgres"
  database:
    description: "Datenbank Name"
    default: "mydb"
  data_dir:
    description: "Pfad für Daten"
    default: "./postgres-data"

info: |
  PostgreSQL Datenbank läuft jetzt!
  Verbindung: postgresql://${user}:${password}@localhost:${port}/${database}
