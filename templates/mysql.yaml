name: mysql-db
description: MySQL Datenbank
image: mysql:8
detached: true
restart: unless-stopped

ports:
  - "${port}:3306"

volumes:
  - "${data_dir}:/var/lib/mysql"

environment:
  MYSQL_ROOT_PASSWORD: "${root_password}"
  MYSQL_DATABASE: "${database}"
  MYSQL_USER: "${user}"
  MYSQL_PASSWORD: "${password}"

variables:
  port:
    description: "Port auf dem Host"
    default: "3306"
  root_password:
    description: "Root Passwort"
    default: "rootpassword"
  password:
    description: "Benutzer Passwort"
    default: "userpassword"
  user:
    description: "Datenbank Benutzer"
    default: "myuser"
  database:
    description: "Datenbank Name"
    default: "mydb"
  data_dir:
    description: "Pfad für Daten"
    default: "./mysql-data"

info: |
  MySQL Datenbank läuft jetzt!
  Verbindung: mysql://${user}:${password}@localhost:${port}/${database}
